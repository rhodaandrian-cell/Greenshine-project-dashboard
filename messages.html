<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greenshine Academy • Finance Alerts</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="messages.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1>Greenshine Academy</h1>
        <p>Finance Alerts • Audit Log • Backend & Frontend Activity</p>
      </div>
    </div>

    <div class="topbar-actions">
      <a href="index.html" class="btn btn-ghost">← Back to Dashboard</a>
      <button id="btnMarkAllRead" class="btn" type="button">Mark All Read</button>
      <button id="btnClearAllMessages" class="btn btn-ghost" type="button">Clear All</button>
    </div>
  </header>

  <main class="container messages-page">
    <section class="meta-strip">
      <div class="meta-card">
        <div class="meta-title">Unread</div>
        <div class="meta-value" id="unreadCount">0</div>
      </div>

      <div class="meta-card">
        <div class="meta-title">Total Alerts</div>
        <div class="meta-value" id="totalMessagesCount">0</div>
      </div>

      <div class="meta-card">
        <div class="meta-title">View</div>
        <div class="meta-value"><span class="badge">AUDIT LOG</span></div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Filter Alerts</h2>
        <p>Search and filter finance alerts without affecting the dashboard.</p>
      </div>

      <div class="row">
        <div class="field">
          <label for="messageSearch">Search</label>
          <input
            id="messageSearch"
            type="text"
            placeholder="student / ADM / receipt / type..."
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="messageFilter">Category</label>
          <select id="messageFilter">
            <option value="ALL">All Alerts</option>
            <option value="UNREAD">Unread Only</option>
            <option value="new-student">New Students</option>
            <option value="new-receipt">New Receipts</option>
            <option value="finance-without-receipt">Finance Updated Without Receipt</option>
            <option value="finance-undefined">Undefined Finance Fields</option>
            <option value="identity-incomplete">Identity Incomplete</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Finance Alerts</h2>
        <p>Latest audit messages from truth detection.</p>
      </div>

      <div id="messagesEmpty" class="messages-empty hidden">
        No alerts found.
      </div>

      <div id="messagesList" class="messages-list"></div>
    </section>
  </main>

  <script src="messages.js"></script>
</body>
</html>
